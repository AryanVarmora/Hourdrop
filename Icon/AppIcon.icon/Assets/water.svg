<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Same shape as drop.svg, so the water stays inside the drop. -->
    <clipPath id="drop">
      <path d="M512 116 C553 193 774 455 774 614 A262 262 0 0 1 250 614 C250 455 471 193 512 116 Z"/>
    </clipPath>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ADBFA"/>
      <stop offset="1" stop-color="#6FC2F7"/>
    </linearGradient>
  </defs>
  <!-- Water in the bottom of the drop, with a gentle wave on top. -->
  <path clip-path="url(#drop)" fill="url(#water)"
        d="M186 698 C348 665 460 690 512 701 S684 758 845 708 L845 1024 L186 1024 Z"/>
</svg>
